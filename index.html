<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moj Kick Stream Hub</title>
    <style>
        /* Kick barve in stil */
        body { font-family: 'Inter', sans-serif; background: #000000; color: #ffffff; text-align: center; margin: 0; padding: 0; }
        header { background: #53fc18; color: black; padding: 20px; font-size: 26px; font-weight: bold; text-transform: uppercase; }
        
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        
        /* Kick Video Okno */
        .kick-embed { position: relative; padding-bottom: 56.25%; height: 0; margin: 30px 0; border: 2px solid #53fc18; border-radius: 8px; overflow: hidden; }
        .kick-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Gumbi in Trgovina */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .buy-btn { background: #53fc18; color: black; border: none; padding: 12px 25px; cursor: pointer; font-weight: bold; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 10px; }
        .buy-btn:hover { background: #44cc14; }

        /* Kontakt */
        .contact { background: #111; padding: 30px; border-radius: 12px; margin-top: 40px; border: 1px dashed #53fc18; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 5px; }
        
        footer { padding: 40px; color: #555; }
    </style>
</head>
<body>

<header>
    🟢 MOJ KICK KANAL
</header>

<div class="container">
    <h2>GLEDAJ ME V ŽIVO</h2>
    
    <div class="kick-embed">
        <iframe src="https://player.kick.com/tvoje-ime" frameborder="0" scrolling="no" allowfullscreen="true"></iframe>
    </div>

    <hr style="border: 0.5px solid #333;">

    <h2>MOJA TRGOVINA</h2>
    <div class="grid">
        <div class="card">
            <h3>SMEŠNI KLIP</h3>
            <p>Oglej si zadnji najboljši trenutek!</p>
            <a href="https://kick.com/tvoje-ime/clips" class="buy-btn">POGLEDAJ KLIPE</a>
        </div>
        <div class="card">
            <h3>MERCH TRGOVINA</h3>
            <p>Podpri kanal z nakupom majice.</p>
            <a href="#" class="buy-btn">OBIŠČI TRGOVINO</a>
        </div>
    </div>

    <div class="contact">
        <h3>PIŠI MI</h3>
        <form action="mailto:tvoj-email@primer.com" method="post" enctype="text/plain">
            <input type="text" name="ime" placeholder="Tvoje ime" required>
            <textarea name="sporocilo" placeholder="Tvoje sporočilo..."></textarea>
            <button type="submit" class="buy-btn" style="width: 100%;">POŠLJI</button>
        </form>
    </div>
</div>

<footer>
    © 2026 Kick Streamer Hub
</footer>

</body>
</html>
